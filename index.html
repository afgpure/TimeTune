<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>TimeTune</title>
    <link rel="stylesheet" href="styles.css">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';" />
</head>

<body>
    <div class="container">
        <div class="sidebar">
            <button class="tab-button" onclick="openTab('chat')">Chat</button>
            <button class="tab-button" onclick="openTab('calendar')">Calendar</button>
        </div>
        <div class="content">
            <div id="chat" class="tab-content">
                <h2>Chat with GPT-3</h2>
                <textarea id="chatInput" placeholder="Ask me anything..."></textarea>
                <button onclick="window.sendChat()">Send</button>
                <div id="chatOutput"></div>
            </div>
            <div id="calendar" class="tab-content">
                <h2>Calendar</h2>
                <div id="calendarView"></div>
            </div>
        </div>
    </div>
    <script src="renderer.js"></script>

</body>

</html>
