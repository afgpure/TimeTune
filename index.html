<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>TimeTune</title>
    <link rel="stylesheet" href="styles.css">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';" />
</head>

<body>
    <div class="container">
        <div class="sidebar">
            <button class="tab-button" onclick="openTab('chat')">Chat</button>
            <button class="tab-button" onclick="openTab('calendar')">Calendar</button>
        </div>
        <div class="content">
            <div id="chat" class="tab-content">
                <h2>Chat with AI</h2>
                <div id="chatOutput" class="chat-output"></div> <!-- Messaging history is now above the input area -->
                <div class="chat-container"> <!-- Container for input and send button -->
                    <textarea id="chatInput" class="chat-input" placeholder="Type your message here..."></textarea>
                    <button onclick="window.sendChat()" class="send-button">&#9650;</button>
                </div>
            </div>
            <div id="calendar" class="tab-content">
                <h2>Calendar</h2>
                <div id="calendarView">
                    <table id="calendarTable">
                        <thead>
                            <tr>
                                <th>Sun</th>
                                <th>Mon</th>
                                <th>Tue</th>
                                <th>Wed</th>
                                <th>Thu</th>
                                <th>Fri</th>
                                <th>Sat</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Calendar days will be populated here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script src="renderer.js"></script>
</body>

</html>
