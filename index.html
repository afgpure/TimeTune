<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>TimeTune</title>
    <link rel="stylesheet" href="styles.css">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';" />
    <style>
        .day-textarea {
            width: 100%;
            height: 80px;
        }


        .current-day {
            background-color: yellow;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="sidebar">
            <button class="tab-button" onclick="openTab('chat')">Chat</button>
            <button class="tab-button" onclick="openTab('calendar')">Calendar</button>
        </div>
        <div class="content">
            <div id="chat" class="tab-content">
                <h2>Chat with AI</h2>
                <div id="chatOutput" class="chat-output"></div>
                <div class="chat-container"> <!--input and send button -->
                    <textarea id="chatInput" class="chat-input" placeholder="Type your message here..."></textarea>
                    <button onclick="window.sendChat()" class="send-button">&#9650;</button>
                </div>
            </div>
            <div id="calendar" class="tab-content">
                <div id="calendarHeader"></div>
                <div id="calendarView">
                    <!-- Calendar dynamically populated here -->
                </div>
            </div>
        </div>
    </div>
    <script src="renderer.js"></script>
</body>

</html>
